# webui configuration
port=8081
root=/usr/share/everest-ui/public
bind=0.0.0.0
ws_path=/ws
backend_ws=ws://127.0.0.1:9002
auth_file=/var/lib/everest/everest-ui/auth.json
app_title=
max_request_bytes=8192
log_level=info
# Set to browser Origin value (for example: http://127.0.0.1:8080) to enforce origin checks.
allow_origin=
