backend_port=9002
everest_config_path=/etc/everest/config.yaml
everest_base_config_path=/etc/everest/everest-ui-config.yaml
rpc_api_host=127.0.0.1
# Comma-separated optional UI features. If omitted, all features are enabled.
# The network page can be disabled with: available_features=none
# Other feature names are reserved for future use.
# available_features=network
everest_restart_allowed_states=Unplugged
safety_controller_settings_bin=/home/root/safety-controller-settings.bin
safety_controller_settings_yaml=/home/root/safety-controller-settings.yaml
# Safety Controller configuration sections to display
# valid values: all, none, pt1000, contactors, estops
safety_controller_available_settings=pt1000,estops
firmware_image_dir=/srv/everest-ui-images
ocpp_base_config_path=/usr/share/everest/modules/OCPP201/component_config/standardized
ocpp_custom_config_path=/var/lib/everest/ocpp201/component_config/custom
system_logs_path=/var/log/journal
# Linux kernel drivers used by ISO high level communications interfaces
# add lms_eth2spi for Lumissil CG5317
network_iso_high_level_comms_drivers=mse102x,qcaspi,lan8650
# Optional exact-device whitelist, selected by /proc/device-tree/compatible.
# For each matching compatible string, configure exact Linux device names:
# network_device_whitelist.chargebyte,imx93-charge-control-y=eth0,qca
# Lists from all matching compatible strings are combined. If no compatible
# key matches (or the device-tree file is unavailable), all devices are listed.
network_device_whitelist.chargebyte,imx6ull-tarragon-master=br0,eth2
network_device_whitelist.chargebyte,imx6ull-tarragon-slave=br0
network_device_whitelist.chargebyte,imx6ull-tarragon-slavext=br0
network_device_whitelist.chargebyte,imx93-charge-control-v=br0,eth3,can0,can1
network_device_whitelist.chargebyte,imx93-charge-control-y=eth0,can0
network_device_whitelist.chargebyte,imx93-charge-som-dc-evb=br0,can0
network_device_whitelist.i2se,imx28-evachargese=br0,can0
pcap_max_size_bytes=104857600
pcap_max_duration_seconds=900
